services:
  db:
    image: postgres:16-alpine
    container_name: turf_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turf}
      POSTGRES_DB: ${POSTGRES_DB:-turf_booking}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turf} -d ${POSTGRES_DB:-turf_booking}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
