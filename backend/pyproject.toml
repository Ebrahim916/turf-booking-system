[project]
name = "turf-booking-system"
version = "0.1.0"
description = "Turf booking system backend API built with FastAPI and PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
# B008: FastAPI's Depends()/Query() in defaults is the intended idiom.
# N818: exception names intentionally omit the Error suffix.
# UP042: the `str, Enum` mixin is deliberate - see app/models/enums.py.
ignore = ["B008", "N818", "UP042"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["jose.*"]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require a live database",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
